<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3차원 도형(정육면체)의 3차원 회전 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 수식(LaTeX) 렌더링을 위한 MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            chtml: { matchFontHeight: false } 
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* 스크롤 원천 차단 및 전체 화면 고정 */
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 메인 컨테이너 */
        .mockup-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 1024px) { .mockup-container { flex-direction: row; } }
        
        /* 칩(Chip) 텍스처 및 부드러운 애니메이션 */
        .chip-red { background-image: repeating-linear-gradient(to top, #ef4444 0px, #ef4444 6px, transparent 6px, transparent 8px); width: 100%; position: absolute; transition: height 0.1s linear, bottom 0.1s linear; }
        .chip-blue { background-image: repeating-linear-gradient(to top, #3b82f6 0px, #3b82f6 6px, transparent 6px, transparent 8px); width: 100%; position: absolute; transition: height 0.1s linear, bottom 0.1s linear; }
        .chip-green { background-image: repeating-linear-gradient(to top, #22c55e 0px, #22c55e 6px, transparent 6px, transparent 8px); width: 100%; position: absolute; transition: height 0.1s linear, bottom 0.1s linear; }

        /* 슬라이더 목업 */
        .slider-track-mock { height: 6px; background: #334155; border-radius: 3px; position: absolute; top: 50%; transform: translateY(-50%); width: 100%; margin: 0; } 
        .thumb-mock { width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; top: -6px; border: 3px solid #94a3b8; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; }
        
        /* 실제 동작하는 투명 슬라이더 */
        input[type=range] { -webkit-appearance: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 10; }

        /* 플레이 버튼 상호작용 */
        .play-btn-circle { transition: all 0.2s; cursor: pointer; }
        .play-btn-circle:hover { transform: scale(1.05); }

        /* MathJax 폰트 크기 상향 */
        .math-label { font-size: 1.8rem; font-weight: bold; }
        .math-formula { font-size: 1.8rem; font-weight: bold; }

        /* 3D 캔버스 래퍼 */
        #canvas-wrapper { cursor: grab; width: 100%; height: 100%; display: block; }
        #canvas-wrapper:active { cursor: grabbing; }
    </style>
</head>
<body>

    <!-- 메인 타이틀 헤더 -->
    <header class="w-full bg-[#0f172a] border-b border-slate-700 flex justify-center items-center h-[65px] shrink-0 z-20 shadow-md relative">
        <div class="absolute left-4 inline-block px-3 py-1 rounded bg-green-500/20 text-green-400 font-bold text-xs border border-green-500/30 hidden md:block">
            3차원 정육면체 엔진 완벽 연동 완료
        </div>
        <h1 class="text-xl md:text-3xl font-black text-white tracking-tight text-center whitespace-nowrap">
            3차원 도형(정육면체)의 3차원 회전 시뮬레이터
        </h1>
    </header>

    <div class="mockup-container">
        
        <!-- 좌측 패널 (화면 높이에 맞춰 완벽하게 들어맞는 Flex 구조) -->
        <div class="w-full lg:w-[38%] bg-slate-900 border-r border-slate-700 flex flex-col p-4 lg:p-6 shadow-2xl z-10 overflow-hidden h-full">
            
            <!-- 1. 고정 영역 (제목 및 수식) - shrink-0 -->
            <div class="shrink-0 flex flex-col items-center w-full">
                <h2 class="text-white font-black text-xl md:text-2xl mb-3 text-center tracking-tight w-full">차원 성분 보존 법칙</h2>
                
                <div id="formula-display" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700 text-center mb-5 shadow-inner text-slate-100 flex items-center justify-center min-h-[60px] math-formula">
                    $$|\vec{v}|^2 = v_x^2 + v_y^2 + v_z^2$$
                </div>
            </div>
            
            <!-- 2. 고정 영역 (라벨 행) - shrink-0 -->
            <div class="shrink-0 flex justify-between items-center w-full mb-3 px-2 gap-3">
                <div class="text-center text-slate-200 flex justify-center items-center flex-1 math-label h-12">
                    \(V_x^2\)
                </div>
                <div class="text-center text-slate-200 flex justify-center items-center flex-1 math-label h-12">
                    \(V_y^2\)
                </div>
                <!-- Z 라벨 및 Hidden 텍스트 -->
                <div class="inline-flex justify-center items-center text-slate-200 bg-slate-700/80 px-4 py-2 rounded-lg shadow-md border border-slate-600 flex-[1.3] min-w-max h-12">
                    <span class="math-label mr-2">\(V_z^2\)</span> <span class="text-[1.1rem] font-bold text-slate-300 font-sans mt-1">(Hidden)</span>
                </div>
            </div>
            
            <!-- 3. 유동적 연장 영역 (막대그래프) - flex-grow를 사용하여 아래 빈 공간을 모두 빨아들임 -->
            <div class="flex-grow min-h-[100px] flex justify-between items-end w-full px-2 gap-3 mb-5">
                
                <!-- X 막대 -->
                <div class="flex-1 flex justify-center h-full pt-2">
                    <div class="w-[50px] h-full bg-[rgba(15,23,42,0.9)] border-2 border-slate-600 rounded relative overflow-hidden shadow-lg">
                        <div id="bar-x-red" class="chip-red" style="height: 100%; bottom: 0%;"></div>
                        <div id="bar-x-green" class="chip-green" style="height: 0%; bottom: 100%;"></div>
                        <div id="bar-x-blue" class="chip-blue" style="height: 0%; bottom: 100%;"></div>
                    </div>
                </div>
                
                <!-- Y 막대 -->
                <div class="flex-1 flex justify-center h-full pt-2">
                    <div class="w-[50px] h-full bg-[rgba(15,23,42,0.9)] border-2 border-slate-600 rounded relative overflow-hidden shadow-lg">
                        <div id="bar-y-blue" class="chip-blue" style="height: 100%; bottom: 0%;"></div>
                        <div id="bar-y-red" class="chip-red" style="height: 0%; bottom: 100%;"></div>
                        <div id="bar-y-green" class="chip-green" style="height: 0%; bottom: 100%;"></div>
                    </div>
                </div>
                
                <!-- Z 막대 (회색 껍질) -->
                <div class="flex-[1.3] flex justify-center h-full">
                    <div class="w-[60px] h-full bg-[#a1a1aa] p-1.5 rounded-lg shadow-md relative">
                        <div class="w-full h-full bg-[#020617] border-2 border-black relative overflow-hidden">
                            <div id="bar-z-green" class="chip-green" style="height: 100%; bottom: 0%;"></div>
                            <div id="bar-z-blue" class="chip-blue" style="height: 0%; bottom: 100%;"></div>
                            <div id="bar-z-red" class="chip-red" style="height: 0%; bottom: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 4. 고정 영역 (하단 컨트롤 패널) -->
            <div class="shrink-0 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-inner flex flex-col gap-2.5">
                
                <!-- X축 컨트롤 -->
                <div class="flex items-center gap-3 bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                    <button id="btn-play-x" class="play-btn-circle w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-300 flex-shrink-0 shadow border border-slate-600">
                        <svg id="icon-play-x" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="icon-pause-x" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    </button>
                    <div class="flex-grow w-full relative">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs md:text-sm font-bold text-slate-300">X축 회전 (가로축 기준 상하)</span>
                            <span class="text-xs text-white" id="val-x">0°</span>
                        </div>
                        <div class="relative w-full h-[18px]">
                            <div class="slider-track-mock">
                                <div id="thumb-x" class="thumb-mock" style="left: 0%;"></div>
                            </div>
                            <input type="range" id="slider-x" min="0" max="360" value="0">
                        </div>
                    </div>
                </div>
                
                <!-- Y축 컨트롤 -->
                <div class="flex items-center gap-3 bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                    <button id="btn-play-y" class="play-btn-circle w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-300 flex-shrink-0 shadow border border-slate-600">
                        <svg id="icon-play-y" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="icon-pause-y" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    </button>
                    <div class="flex-grow w-full relative">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs md:text-sm font-bold text-slate-300">Y축 회전 (세로축 기준 좌우)</span>
                            <span class="text-xs text-white" id="val-y">0°</span>
                        </div>
                        <div class="relative w-full h-[18px]">
                            <div class="slider-track-mock">
                                <div id="thumb-y" class="thumb-mock" style="left: 0%;"></div>
                            </div>
                            <input type="range" id="slider-y" min="0" max="360" value="0">
                        </div>
                    </div>
                </div>
                
                <!-- Z축 컨트롤 -->
                <div class="flex items-center gap-3 bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                    <button id="btn-play-z" class="play-btn-circle w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-300 flex-shrink-0 shadow border border-slate-600">
                        <svg id="icon-play-z" class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="icon-pause-z" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    </button>
                    <div class="flex-grow w-full relative">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs md:text-sm font-bold text-slate-300">Z축 회전 (모니터 평면 빙글)</span>
                            <span class="text-xs text-white" id="val-z">0°</span>
                        </div>
                        <div class="relative w-full h-[18px]">
                            <div class="slider-track-mock">
                                <div id="thumb-z" class="thumb-mock" style="left: 0%;"></div>
                            </div>
                            <input type="range" id="slider-z" min="0" max="360" value="0">
                        </div>
                    </div>
                </div>

                <!-- 하단 공통 버튼 영역 -->
                <div class="flex justify-center gap-3 mt-1">
                    <button id="btn-play-all" class="play-btn-circle bg-indigo-600 hover:bg-indigo-500 text-white text-[0.9rem] font-bold py-3 px-4 rounded-full shadow-lg flex items-center justify-center flex-[1.2] whitespace-nowrap">
                        <svg id="icon-play-all" class="w-5 h-5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="icon-pause-all" class="w-5 h-5 mr-1.5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        <span id="text-play-all">3차원 동시 회전 재생</span>
                    </button>
                    <button id="btn-reset-all" class="play-btn-circle bg-slate-700 hover:bg-slate-600 text-white text-[0.9rem] font-bold py-3 px-4 rounded-full shadow-lg flex items-center justify-center border border-slate-600 flex-[0.8] whitespace-nowrap">
                        <svg class="w-5 h-5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        처음 위치로
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 우측 패널 (3D 정육면체 렌더링 캔버스) -->
        <div class="w-full lg:w-[62%] relative flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-[#020617] overflow-hidden">
            
            <!-- 3차원 좌표계 안내 위젯 -->
            <div class="absolute top-6 left-6 bg-slate-800/80 border border-slate-600 p-4 rounded-xl z-20 shadow-lg flex flex-col items-center backdrop-blur-md pointer-events-none">
                <div class="text-[0.9rem] text-slate-200 font-bold mb-4">3차원 좌표계</div>
                <svg width="100" height="100" viewBox="0 0 200 200" class="overflow-visible">
                    <defs>
                        <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
                        </marker>
                    </defs>
                    <line x1="100" y1="100" x2="36" y2="164" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                    <text x="15" y="190" fill="#94a3b8" font-weight="900" font-size="24">Z</text>
                    <line x1="100" y1="100" x2="190" y2="100" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                    <text x="205" y="108" fill="#94a3b8" font-weight="900" font-size="24">X</text>
                    <line x1="100" y1="100" x2="100" y2="10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                    <text x="92" y="-5" fill="#94a3b8" font-weight="900" font-size="24">Y</text>
                    <circle cx="100" cy="100" r="6" fill="white" />
                </svg>
            </div>

            <!-- 드래그 안내 문구 -->
            <div class="absolute top-6 right-6 text-sm text-slate-300 bg-slate-800/80 backdrop-blur px-4 py-2.5 rounded-lg border border-slate-600 flex items-center shadow-lg z-20 pointer-events-none">
                <svg class="w-5 h-5 mr-2 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                마우스로 화면을 드래그하여 회전
            </div>

            <!-- 바닥 배경 선 (SVG) -->
            <svg width="100%" height="100%" viewBox="0 0 600 600" class="absolute inset-0 z-0 pointer-events-none">
                <g stroke="#1e293b" stroke-width="1" opacity="0.4">
                    <line x1="50" y1="480" x2="550" y2="380" />
                    <line x1="80" y1="500" x2="580" y2="400" />
                    <line x1="110" y1="520" x2="610" y2="420" />
                    <line x1="20" y1="460" x2="520" y2="360" />
                    <line x1="250" y1="220" x2="450" y2="550" />
                    <line x1="200" y1="240" x2="400" y2="570" />
                    <line x1="300" y1="200" x2="500" y2="530" />
                </g>
            </svg>

            <!-- Three.js Canvas Container (여기에 정육면체 렌더링 됨) -->
            <div id="canvas-wrapper" class="absolute inset-0 z-10 w-full h-full"></div>
        </div>
    </div>

    <!-- 3차원 정육면체용 Three.js 엔진 로직 -->
    <script>
        // --- 1. Three.js 설정 (직교 카메라 적용 및 크기 설정) ---
        const container = document.getElementById('canvas-wrapper');
        const scene = new THREE.Scene();
        
        // 조명 추가 (3D 볼륨감을 위해 필수)
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 30);
        scene.add(dirLight);

        let width = container.clientWidth;
        let height = container.clientHeight;
        const aspect = width / height;
        const viewSize = 18; 
        
        // 평행 투영(직교 카메라)을 사용하여 막대그래프의 길이 비율(투영값)과 완벽하게 일치시킴
        const camera = new THREE.OrthographicCamera(-viewSize * aspect / 2, viewSize * aspect / 2, viewSize / 2, -viewSize / 2, 0.1, 1000);
        camera.position.set(0, 0, 100); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. 3차원 정육면체 객체 구성 ---
        const cubeGroup = new THREE.Group();
        const sideLength = 10;
        const h = sideLength / 2;

        // 정육면체의 내부 (반투명 연회색)
        // depthWrite: false 를 주어 뒤에 그려진 옅은 모서리들이 투명한 면과 섞여 보이도록 함
        const cubeGeo = new THREE.BoxGeometry(sideLength, sideLength, sideLength);
        const cubeMat = new THREE.MeshLambertMaterial({ 
            color: 0xcbd5e1, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide
        });
        const boxMesh = new THREE.Mesh(cubeGeo, cubeMat);
        cubeGroup.add(boxMesh);

        // 굵고 선명한 모서리 생성 함수
        function createThickEdge(p1, p2, colorHex) {
            const path = new THREE.LineCurve3(new THREE.Vector3(...p1), new THREE.Vector3(...p2));
            const tubeGeo = new THREE.TubeGeometry(path, 1, 0.15, 8, false); 
            const tubeMat = new THREE.MeshBasicMaterial({ color: colorHex });
            return new THREE.Mesh(tubeGeo, tubeMat);
        }

        // 총 12개의 모서리 (X: 빨강, Y: 파랑, Z: 초록)
        // Red (X축 평행 모서리 4개)
        cubeGroup.add(createThickEdge([-h,-h,-h], [h,-h,-h], 0xef4444));
        cubeGroup.add(createThickEdge([-h, h,-h], [h, h,-h], 0xef4444));
        cubeGroup.add(createThickEdge([-h,-h, h], [h,-h, h], 0xef4444));
        cubeGroup.add(createThickEdge([-h, h, h], [h, h, h], 0xef4444));
        
        // Green (Z축 평행 모서리 4개 - 깊이 방향의 새로운 변)
        cubeGroup.add(createThickEdge([-h,-h,-h], [-h,-h, h], 0x22c55e));
        cubeGroup.add(createThickEdge([ h,-h,-h], [ h,-h, h], 0x22c55e));
        cubeGroup.add(createThickEdge([-h, h,-h], [-h, h, h], 0x22c55e));
        cubeGroup.add(createThickEdge([ h, h,-h], [ h, h, h], 0x22c55e));

        // Blue (Y축 평행 모서리 4개)
        cubeGroup.add(createThickEdge([-h,-h,-h], [-h, h,-h], 0x3b82f6));
        cubeGroup.add(createThickEdge([ h,-h,-h], [ h, h,-h], 0x3b82f6));
        cubeGroup.add(createThickEdge([-h,-h, h], [-h, h, h], 0x3b82f6));
        cubeGroup.add(createThickEdge([ h,-h, h], [ h, h, h], 0x3b82f6));

        // 8개의 꼭짓점 구슬
        const sphereGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
        const corners = [
            [-h,-h,-h], [h,-h,-h], [-h,h,-h], [h,h,-h],
            [-h,-h,h], [h,-h,h], [-h,h,h], [h,h,h]
        ];
        corners.forEach(pos => {
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.set(...pos);
            cubeGroup.add(sphere);
        });

        // 렌더링 순서 ZYX 보장
        cubeGroup.rotation.order = 'ZYX';
        scene.add(cubeGroup);

        // --- 3. UI 객체 및 변수 바인딩 ---
        const UI = {
            sliderX: document.getElementById('slider-x'),
            sliderY: document.getElementById('slider-y'),
            sliderZ: document.getElementById('slider-z'),
            thumbX: document.getElementById('thumb-x'),
            thumbY: document.getElementById('thumb-y'),
            thumbZ: document.getElementById('thumb-z'),
            valX: document.getElementById('val-x'),
            valY: document.getElementById('val-y'),
            valZ: document.getElementById('val-z'),
            
            // 각 막대 안의 3색 칩 
            barXRed: document.getElementById('bar-x-red'), barXGreen: document.getElementById('bar-x-green'), barXBlue: document.getElementById('bar-x-blue'),
            barYRed: document.getElementById('bar-y-red'), barYGreen: document.getElementById('bar-y-green'), barYBlue: document.getElementById('bar-y-blue'),
            barZRed: document.getElementById('bar-z-red'), barZGreen: document.getElementById('bar-z-green'), barZBlue: document.getElementById('bar-z-blue'),
            
            btnPlayAll: document.getElementById('btn-play-all'),
            btnResetAll: document.getElementById('btn-reset-all'),
            iconPlayAll: document.getElementById('icon-play-all'),
            iconPauseAll: document.getElementById('icon-pause-all'),
            textPlayAll: document.getElementById('text-play-all'),
            
            btnPlayX: document.getElementById('btn-play-x'),
            iconPlayX: document.getElementById('icon-play-x'),
            iconPauseX: document.getElementById('icon-pause-x'),
            
            btnPlayY: document.getElementById('btn-play-y'),
            iconPlayY: document.getElementById('icon-play-y'),
            iconPauseY: document.getElementById('icon-pause-y'),
            
            btnPlayZ: document.getElementById('btn-play-z'),
            iconPlayZ: document.getElementById('icon-play-z'),
            iconPauseZ: document.getElementById('icon-pause-z')
        };

        // --- 4. 3차원 수학적 계산 및 동기화 함수 ---
        function updateFromAngles(rx, ry, rz) {
            cubeGroup.rotation.set(rx, ry, rz);
            
            const toDeg = (rad) => {
                let d = Math.round(rad * 180 / Math.PI) % 360;
                return d < 0 ? d + 360 : d;
            };
            
            let degX = toDeg(rx), degY = toDeg(ry), degZ = toDeg(rz);
            
            // 텍스트 및 가짜 썸(Thumb) 위치 갱신
            UI.sliderX.value = degX; UI.valX.innerText = degX + '°'; UI.thumbX.style.left = `calc(${(degX/360)*100}% - 9px)`;
            UI.sliderY.value = degY; UI.valY.innerText = degY + '°'; UI.thumbY.style.left = `calc(${(degY/360)*100}% - 9px)`;
            UI.sliderZ.value = degZ; UI.valZ.innerText = degZ + '°'; UI.thumbZ.style.left = `calc(${(degZ/360)*100}% - 9px)`;

            // 정육면체의 3가지 직교 축(빨강, 파랑, 초록) 벡터 추출
            const euler = new THREE.Euler(rx, ry, rz, 'ZYX');
            const vRed = new THREE.Vector3(1, 0, 0).applyEuler(euler);   // X축 방향 벡터
            const vBlue = new THREE.Vector3(0, 1, 0).applyEuler(euler);  // Y축 방향 벡터
            const vGreen = new THREE.Vector3(0, 0, 1).applyEuler(euler); // Z축 방향 벡터

            // 1. X 막대 갱신 (빨강 - 초록 - 파랑 순서로 쌓기)
            let rx_r = vRed.x * vRed.x * 100;
            let rx_g = vGreen.x * vGreen.x * 100;
            let rx_b = vBlue.x * vBlue.x * 100;
            
            UI.barXRed.style.height = `${rx_r}%`;     UI.barXRed.style.bottom = `0%`;
            UI.barXGreen.style.height = `${rx_g}%`;   UI.barXGreen.style.bottom = `${rx_r}%`;
            UI.barXBlue.style.height = `${rx_b}%`;    UI.barXBlue.style.bottom = `${rx_r + rx_g}%`;

            // 2. Y 막대 갱신 (파랑 - 빨강 - 초록 순서로 쌓기)
            let ry_b = vBlue.y * vBlue.y * 100;
            let ry_r = vRed.y * vRed.y * 100;
            let ry_g = vGreen.y * vGreen.y * 100;
            
            UI.barYBlue.style.height = `${ry_b}%`;    UI.barYBlue.style.bottom = `0%`;
            UI.barYRed.style.height = `${ry_r}%`;     UI.barYRed.style.bottom = `${ry_b}%`;
            UI.barYGreen.style.height = `${ry_g}%`;   UI.barYGreen.style.bottom = `${ry_b + ry_r}%`;

            // 3. Z 막대 갱신 (초록 - 파랑 - 빨강 순서로 쌓기)
            let rz_g = vGreen.z * vGreen.z * 100;
            let rz_b = vBlue.z * vBlue.z * 100;
            let rz_r = vRed.z * vRed.z * 100;
            
            UI.barZGreen.style.height = `${rz_g}%`;   UI.barZGreen.style.bottom = `0%`;
            UI.barZBlue.style.height = `${rz_b}%`;    UI.barZBlue.style.bottom = `${rz_g}%`;
            UI.barZRed.style.height = `${rz_r}%`;     UI.barZRed.style.bottom = `${rz_g + rz_b}%`;
        }

        // --- 5. 마우스/터치 드래그 상호작용 (캔버스 위 3D 회전) ---
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        function handleDragStart(x, y) {
            isDragging = true;
            prevMouse = { x, y };
            if (isPlayingAll) togglePlayAll();
            if (isPlayingX) togglePlayX();
            if (isPlayingY) togglePlayY();
            if (isPlayingZ) togglePlayZ();
        }

        function handleDragMove(x, y) {
            if (!isDragging) return;
            const deltaX = x - prevMouse.x;
            const deltaY = y - prevMouse.y;
            
            const newRy = cubeGroup.rotation.y + deltaX * 0.015;
            const newRx = cubeGroup.rotation.x + deltaY * 0.015;
            
            updateFromAngles(newRx, newRy, cubeGroup.rotation.z);
            prevMouse = { x, y };
        }

        container.addEventListener('mousedown', e => handleDragStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => handleDragMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => { isDragging = false; });
        container.addEventListener('mouseleave', () => { isDragging = false; });

        container.addEventListener('touchstart', e => handleDragStart(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchmove', e => {
            if (isDragging) { e.preventDefault(); handleDragMove(e.touches[0].clientX, e.touches[0].clientY); }
        }, {passive: false});
        window.addEventListener('touchend', () => { isDragging = false; });

        // --- 6. 재생 및 슬라이더 제어 로직 ---
        let isPlayingAll = false, isPlayingX = false, isPlayingY = false, isPlayingZ = false;

        function togglePlayAll() {
            isPlayingAll = !isPlayingAll;
            UI.iconPlayAll.classList.toggle('hidden', isPlayingAll);
            UI.iconPauseAll.classList.toggle('hidden', !isPlayingAll);
            
            if (isPlayingAll) {
                UI.textPlayAll.innerText = "모든 회전 정지";
                UI.btnPlayAll.classList.replace('bg-indigo-600', 'bg-rose-600');
                UI.btnPlayAll.classList.replace('hover:bg-indigo-500', 'hover:bg-rose-500');
                if(isPlayingX) togglePlayX();
                if(isPlayingY) togglePlayY();
                if(isPlayingZ) togglePlayZ();
            } else {
                UI.textPlayAll.innerText = "3차원 동시 회전 재생"; 
                UI.btnPlayAll.classList.replace('bg-rose-600', 'bg-indigo-600');
                UI.btnPlayAll.classList.replace('hover:bg-rose-500', 'hover:bg-indigo-500');
            }
        }

        function togglePlayX() {
            isPlayingX = !isPlayingX;
            if(isPlayingAll) togglePlayAll();
            UI.iconPlayX.classList.toggle('hidden', isPlayingX);
            UI.iconPauseX.classList.toggle('hidden', !isPlayingX);
        }
        function togglePlayY() {
            isPlayingY = !isPlayingY;
            if(isPlayingAll) togglePlayAll();
            UI.iconPlayY.classList.toggle('hidden', isPlayingY);
            UI.iconPauseY.classList.toggle('hidden', !isPlayingY);
        }
        function togglePlayZ() {
            isPlayingZ = !isPlayingZ;
            if(isPlayingAll) togglePlayAll();
            UI.iconPlayZ.classList.toggle('hidden', isPlayingZ);
            UI.iconPauseZ.classList.toggle('hidden', !isPlayingZ);
        }

        UI.btnPlayAll.addEventListener('click', togglePlayAll);
        UI.btnPlayX.addEventListener('click', togglePlayX);
        UI.btnPlayY.addEventListener('click', togglePlayY);
        UI.btnPlayZ.addEventListener('click', togglePlayZ);

        [UI.sliderX, UI.sliderY, UI.sliderZ].forEach((slider, idx) => {
            slider.addEventListener('input', () => {
                if (isPlayingAll) togglePlayAll();
                if (idx === 0 && isPlayingX) togglePlayX();
                if (idx === 1 && isPlayingY) togglePlayY();
                if (idx === 2 && isPlayingZ) togglePlayZ();
                updateFromAngles(
                    parseFloat(UI.sliderX.value) * Math.PI / 180,
                    parseFloat(UI.sliderY.value) * Math.PI / 180,
                    parseFloat(UI.sliderZ.value) * Math.PI / 180
                );
            });
        });

        UI.btnResetAll.addEventListener('click', () => {
            if(isPlayingAll) togglePlayAll();
            if(isPlayingX) togglePlayX();
            if(isPlayingY) togglePlayY();
            if(isPlayingZ) togglePlayZ();
            // 각 축의 회전값을 초기화 (정면 뷰)
            updateFromAngles(0, 0, 0);
        });

        // --- 7. 렌더링 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlayingAll || isPlayingX || isPlayingY || isPlayingZ) {
                let rx = cubeGroup.rotation.x;
                let ry = cubeGroup.rotation.y;
                let rz = cubeGroup.rotation.z;
                
                if (isPlayingAll || isPlayingX) rx += 0.015;
                if (isPlayingAll || isPlayingY) ry += 0.010;
                if (isPlayingAll || isPlayingZ) rz += 0.005;
                
                updateFromAngles(rx, ry, rz);
            }

            renderer.render(scene, camera);
        }

        // 창 크기 조절
        window.addEventListener('resize', () => {
            if(container) {
                width = container.clientWidth;
                height = container.clientHeight;
                const newAspect = width / height;
                camera.left = -viewSize * newAspect / 2;
                camera.right = viewSize * newAspect / 2;
                camera.top = viewSize / 2;
                camera.bottom = -viewSize / 2;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }
        });

        // 초기화 실행
        // 정육면체가 X, Y, Z축 모서리 색상을 잘 보여주기 위해 약간 삐딱하게 초기 세팅
        updateFromAngles(Math.PI/6, -Math.PI/6, 0); 
        
        // MathJax 초기화 오류 방지
        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise([document.getElementById('formula-display')]).catch(err => console.warn(err));
        }

        animate();

    </script>
</body>
</html>
