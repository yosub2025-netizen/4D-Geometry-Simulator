<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1차원 도형(선분)의 4차원 회전 시뮬레이터 (~에 대한 회전 적용본)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 수학 수식(LaTeX) 렌더링을 위한 MathJax 라이브러리 추가 -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 스크롤 완벽 차단 및 전체 화면 고정 */
        body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #1e293b; margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; position: fixed; }
        
        .mockup-container { background: #0f172a; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 칩(Chip) 텍스처 (1차원이므로 빨간색만 사용) */
        .chip-red { background-image: repeating-linear-gradient(to top, #ef4444 0px, #ef4444 6px, transparent 6px, transparent 8px); width: 100%; transition: height 0.08s linear; position: absolute; bottom: 0; }

        /* 커스텀 슬라이더 스타일 */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-top: 6px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%; background: white; cursor: pointer; border: 4px solid #94a3b8; box-shadow: 0 0 10px rgba(0,0,0,0.5); margin-top: -8px;}
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #334155; border-radius: 3px; }
        
        /* 슬라이더 테마 (회색 vs 보라색) */
        .slider-gray::-webkit-slider-thumb { border-color: #94a3b8; }
        .slider-purple::-webkit-slider-thumb { border-color: #a855f7; }

        /* MathJax 라벨 스타일링 */
        .math-label { font-size: 1.6rem; font-weight: bold; }
        .math-formula { font-size: 1.8rem; font-weight: bold; }

        /* 3D 뷰 캔버스 래퍼 */
        #right-panel-svg { cursor: grab; }
        #right-panel-svg:active { cursor: grabbing; }

        /* 버튼 애니메이션 */
        .btn-hover { transition: transform 0.1s, box-shadow 0.1s; }
        .btn-hover:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="mockup-container">
        
        <!-- 상단 헤더 -->
        <header class="bg-[#0f172a] w-full border-b border-slate-700 flex justify-center items-center h-[60px] shrink-0 relative z-20">
            <h1 class="text-xl md:text-2xl font-black text-white tracking-tight text-center whitespace-nowrap px-4">
                1차원 도형(선분) 4차원 회전 시뮬레이터
            </h1>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <div class="flex-grow flex flex-col lg:flex-row w-full overflow-hidden relative min-h-0">
            
            <!-- 우측 패널 (3D 뷰) -->
            <div id="right-panel-svg" class="w-full lg:w-[58%] h-[40vh] lg:h-full relative flex items-center justify-center bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800 to-[#020617] overflow-hidden order-1 lg:order-2 shrink-0 border-b lg:border-b-0 lg:border-l border-slate-700">
                
                <!-- 4차원 좌표계 위젯 -->
                <div class="absolute top-6 left-6 bg-slate-800/80 border border-slate-600 p-4 rounded-xl z-20 shadow-lg flex flex-col items-center backdrop-blur-md pointer-events-none">
                    <div class="text-sm text-slate-200 font-bold mb-3">4차원 좌표계</div>
                    <svg width="130" height="130" viewBox="0 0 220 220" class="overflow-visible">
                        <defs>
                            <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
                            </marker>
                            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
                            </marker>
                        </defs>
                        <!-- Z축 -->
                        <line x1="110" y1="110" x2="36" y2="184" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                        <text x="15" y="200" fill="#94a3b8" font-weight="900" font-size="24">Z</text>
                        <!-- X축 -->
                        <line x1="110" y1="110" x2="200" y2="110" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                        <text x="215" y="118" fill="#94a3b8" font-weight="900" font-size="24">X</text>
                        <!-- Y축 -->
                        <line x1="110" y1="110" x2="110" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
                        <text x="102" y="5" fill="#94a3b8" font-weight="900" font-size="24">Y</text>
                        <!-- W축 (보라색 점선) -->
                        <line x1="110" y1="110" x2="184" y2="184" stroke="#a855f7" stroke-width="4" stroke-dasharray="8,5" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
                        <text x="195" y="200" fill="#a855f7" font-weight="900" font-size="24">W</text>
                        
                        <circle cx="110" cy="110" r="7" fill="white" />
                    </svg>
                </div>

                <div class="absolute top-6 right-6 text-sm text-slate-300 bg-slate-800/80 backdrop-blur px-4 py-3 rounded-lg border border-slate-600 flex items-center shadow-lg z-20 pointer-events-none">
                    <svg class="w-5 h-5 mr-2 text-indigo-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                    드래그하여 공간 뷰 회전
                </div>

                <!-- 바닥 그리드 -->
                <svg width="100%" height="100%" viewBox="0 0 600 600" class="absolute inset-0 z-0 pointer-events-none">
                    <g stroke="#1e293b" stroke-width="1" opacity="0.4">
                        <line x1="50" y1="480" x2="550" y2="380" />
                        <line x1="80" y1="500" x2="580" y2="400" />
                        <line x1="110" y1="520" x2="610" y2="420" />
                        <line x1="20" y1="460" x2="520" y2="360" />
                        <line x1="250" y1="220" x2="450" y2="550" />
                        <line x1="200" y1="240" x2="400" y2="570" />
                        <line x1="300" y1="200" x2="500" y2="530" />
                    </g>
                </svg>
                
                <!-- 1차원 선분 렌더링 -->
                <svg width="100%" height="100%" viewBox="0 0 600 600" class="absolute inset-0 z-10 drop-shadow-2xl pointer-events-none">
                    <line id="anim-line" x1="220" y1="330" x2="380" y2="270" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                    <circle id="anim-node1" cx="220" cy="330" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />
                    <circle id="anim-node2" cx="380" cy="270" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />
                </svg>
            </div>

            <!-- 좌측 패널 (컨트롤 & 그래프) -->
            <div class="w-full lg:w-[42%] bg-slate-900 p-4 lg:p-6 flex flex-col z-10 shadow-2xl h-full order-2 lg:order-1 overflow-y-auto scrollbar-hide min-h-0">
                
                <!-- 1. 고정 타이틀 및 4차원 수식 -->
                <div class="flex flex-col items-center w-full mb-1 shrink-0">
                    <h3 class="text-white font-black text-xl mb-1 text-center tracking-wider w-full">차원 성분 보존 법칙</h3>
                    <div class="w-full border-b border-slate-700 pb-2 flex justify-center text-slate-100 math-formula">
                        $$ |\vec{v}|^2 = v_x^2 + v_y^2 + v_z^2 + v_w^2 $$
                    </div>
                </div>

                <!-- 2. 라벨 및 막대 영역 -->
                <div class="flex-grow flex flex-col w-full mt-2 mb-3 min-h-[150px]">
                    <!-- 라벨 행 -->
                    <div class="flex w-full mb-2 px-1 gap-2 items-center shrink-0">
                        <div class="flex-1 flex justify-center items-center text-slate-200 math-label">
                            \(v_x^2\)
                        </div>
                        <div class="flex-1 flex justify-center items-center text-slate-200 math-label">
                            \(v_y^2\)
                        </div>
                        <div class="flex-1 flex justify-center items-center">
                            <div class="inline-flex flex-col items-center text-slate-200 bg-slate-700/80 w-full py-1 rounded shadow border border-slate-600">
                                <span class="math-label leading-none">\(v_z^2\)</span>
                                <span class="text-sm font-bold text-slate-300 mt-1 leading-none">(Hidden)</span>
                            </div>
                        </div>
                        <div class="flex-1 flex justify-center items-center">
                            <div class="inline-flex flex-col items-center text-purple-300 bg-slate-700/80 w-full py-1 rounded shadow border border-purple-900/50">
                                <span class="math-label leading-none">\(v_w^2\)</span>
                                <span class="text-sm font-bold text-purple-300 mt-1 leading-none">(Hidden)</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 막대 행 -->
                    <div class="flex-grow flex w-full gap-2 items-end">
                        <div class="flex-1 h-full flex justify-center">
                            <div class="w-full max-w-[50px] h-full bg-[rgba(15,23,42,0.9)] border-2 border-slate-600 rounded relative overflow-hidden shadow-lg">
                                <div id="bar-x-red" class="chip-red" style="height: 100%;"></div>
                            </div>
                        </div>
                        <div class="flex-1 h-full flex justify-center">
                            <div class="w-full max-w-[50px] h-full bg-[rgba(15,23,42,0.9)] border-2 border-slate-600 rounded relative overflow-hidden shadow-lg">
                                <div id="bar-y-red" class="chip-red" style="height: 0%;"></div>
                            </div>
                        </div>
                        <div class="flex-1 h-full flex justify-center">
                            <div class="w-full max-w-[60px] h-full bg-[#a1a1aa] p-1.5 rounded-lg shadow-md relative">
                                <div class="w-full h-full bg-[#020617] border-2 border-black relative overflow-hidden">
                                    <div id="bar-z-red" class="chip-red" style="height: 0%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1 h-full flex justify-center">
                            <div class="w-full max-w-[60px] h-full bg-[#a1a1aa] p-1.5 rounded-lg shadow-md relative">
                                <div class="w-full h-full bg-[#020617] border-2 border-purple-900/50 relative overflow-hidden">
                                    <div id="bar-w-red" class="chip-red" style="height: 0%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 3. 슬라이더 컨트롤 영역 (~평면에 대한 회전으로 라벨 변경됨) -->
                <div class="bg-slate-800 p-3 lg:p-4 rounded-xl border border-slate-700 shadow-inner shrink-0">
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <!-- 1행 -->
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-slate-300 tracking-tight whitespace-nowrap">XY 평면에 대한 회전</span>
                                <span id="val-xy" class="text-sm lg:text-base font-bold text-white">0°</span>
                            </div>
                            <input type="range" id="slider-xy" min="0" max="360" value="0" class="slider-gray">
                        </div>
                        
                        <div class="bg-purple-900/30 p-3 rounded-lg border border-purple-500/30 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-purple-300 tracking-tight whitespace-nowrap">XW 평면에 대한 회전</span>
                                <span id="val-xw" class="text-sm lg:text-base font-bold text-purple-200">0°</span>
                            </div>
                            <input type="range" id="slider-xw" min="0" max="360" value="0" class="slider-purple">
                        </div>

                        <!-- 2행 -->
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-slate-300 tracking-tight whitespace-nowrap">YZ 평면에 대한 회전</span>
                                <span id="val-yz" class="text-sm lg:text-base font-bold text-white">0°</span>
                            </div>
                            <input type="range" id="slider-yz" min="0" max="360" value="0" class="slider-gray">
                        </div>
                        
                        <div class="bg-purple-900/30 p-3 rounded-lg border border-purple-500/30 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-purple-300 tracking-tight whitespace-nowrap">YW 평면에 대한 회전</span>
                                <span id="val-yw" class="text-sm lg:text-base font-bold text-purple-200">0°</span>
                            </div>
                            <input type="range" id="slider-yw" min="0" max="360" value="0" class="slider-purple">
                        </div>
                        
                        <!-- 3행 -->
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-slate-300 tracking-tight whitespace-nowrap">XZ 평면에 대한 회전</span>
                                <span id="val-xz" class="text-sm lg:text-base font-bold text-white">0°</span>
                            </div>
                            <input type="range" id="slider-xz" min="0" max="360" value="0" class="slider-gray">
                        </div>

                        <div class="bg-purple-900/30 p-3 rounded-lg border border-purple-500/30 flex flex-col justify-center">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[0.85rem] lg:text-[0.95rem] font-bold text-purple-300 tracking-tight whitespace-nowrap">ZW 평면에 대한 회전</span>
                                <span id="val-zw" class="text-sm lg:text-base font-bold text-purple-200">0°</span>
                            </div>
                            <input type="range" id="slider-zw" min="0" max="360" value="0" class="slider-purple">
                        </div>
                    </div>

                    <div class="flex justify-center gap-3">
                        <button id="btn-play-all" class="btn-hover bg-indigo-600 text-white text-base lg:text-lg font-bold py-3 px-4 rounded-full shadow-lg flex-1">
                            4차원 동시 회전 재생
                        </button>
                        <button id="btn-reset" class="btn-hover bg-slate-700 text-white text-base lg:text-lg font-bold py-3 px-4 rounded-full shadow-lg border border-slate-600 flex-1">
                            처음 위치로
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- 순수 자바스크립트 기반 애니메이션 수학 엔진 -->
    <script>
        const UI = {
            sliderXY: document.getElementById('slider-xy'),
            sliderYZ: document.getElementById('slider-yz'),
            sliderXZ: document.getElementById('slider-xz'),
            sliderXW: document.getElementById('slider-xw'),
            sliderYW: document.getElementById('slider-yw'),
            sliderZW: document.getElementById('slider-zw'),

            valXY: document.getElementById('val-xy'),
            valYZ: document.getElementById('val-yz'),
            valXZ: document.getElementById('val-xz'),
            valXW: document.getElementById('val-xw'),
            valYW: document.getElementById('val-yw'),
            valZW: document.getElementById('val-zw'),

            barX: document.getElementById('bar-x-red'),
            barY: document.getElementById('bar-y-red'),
            barZ: document.getElementById('bar-z-red'),
            barW: document.getElementById('bar-w-red'),

            animLine: document.getElementById('anim-line'),
            animNode1: document.getElementById('anim-node1'),
            animNode2: document.getElementById('anim-node2'),
            rightPanel: document.getElementById('right-panel-svg'),
            
            btnPlayAll: document.getElementById('btn-play-all'),
            btnReset: document.getElementById('btn-reset')
        };

        // 4D -> 2D 투영 벡터
        const pX = [80, -30];
        const pY = [0, -80];
        const pZ = [-60, 60];
        const pW = [40, 40];

        function updateState(r_xy, r_yz, r_xz, r_xw, r_yw, r_zw) {
            // UI 텍스트 및 슬라이더 값 동기화
            UI.sliderXY.value = r_xy; UI.valXY.innerText = Math.round(r_xy) + '°';
            UI.sliderYZ.value = r_yz; UI.valYZ.innerText = Math.round(r_yz) + '°';
            UI.sliderXZ.value = r_xz; UI.valXZ.innerText = Math.round(r_xz) + '°';
            UI.sliderXW.value = r_xw; UI.valXW.innerText = Math.round(r_xw) + '°';
            UI.sliderYW.value = r_yw; UI.valYW.innerText = Math.round(r_yw) + '°';
            UI.sliderZW.value = r_zw; UI.valZW.innerText = Math.round(r_zw) + '°';

            // 도 -> 라디안 변환
            const rad = deg => deg * Math.PI / 180;
            let xy = rad(r_xy), yz = rad(r_yz), xz = rad(r_xz);
            let xw = rad(r_xw), yw = rad(r_yw), zw = rad(r_zw);

            // 초기 1차원 단위 벡터
            let v = [1, 0, 0, 0];

            // 6개의 4차원 직교 평면 회전 행렬 적용 ('~ 평면에 대한 회전' = 해당 평면 고정, 나머지 두 축 회전)
            // 1. XY 평면에 대한 회전 (X, Y 고정, Z, W 회전)
            let c1 = Math.cos(xy), s1 = Math.sin(xy);
            let z1 = v[2]*c1 - v[3]*s1, w1 = v[2]*s1 + v[3]*c1;
            v[2] = z1; v[3] = w1;

            // 2. YZ 평면에 대한 회전 (Y, Z 고정, X, W 회전)
            let c2 = Math.cos(yz), s2 = Math.sin(yz);
            let x2 = v[0]*c2 - v[3]*s2, w2 = v[0]*s2 + v[3]*c2;
            v[0] = x2; v[3] = w2;

            // 3. XZ 평면에 대한 회전 (X, Z 고정, Y, W 회전)
            let c3 = Math.cos(xz), s3 = Math.sin(xz);
            let y3 = v[1]*c3 - v[3]*s3, w3 = v[1]*s3 + v[3]*c3;
            v[1] = y3; v[3] = w3;

            // 4. XW 평면에 대한 회전 (X, W 고정, Y, Z 회전)
            let c4 = Math.cos(xw), s4 = Math.sin(xw);
            let y4 = v[1]*c4 - v[2]*s4, z4 = v[1]*s4 + v[2]*c4;
            v[1] = y4; v[2] = z4;

            // 5. YW 평면에 대한 회전 (Y, W 고정, X, Z 회전)
            let c5 = Math.cos(yw), s5 = Math.sin(yw);
            let x5 = v[0]*c5 - v[2]*s5, z5 = v[0]*s5 + v[2]*c5;
            v[0] = x5; v[2] = z5;

            // 6. ZW 평면에 대한 회전 (Z, W 고정, X, Y 회전)
            let c6 = Math.cos(zw), s6 = Math.sin(zw);
            let x6 = v[0]*c6 - v[1]*s6, y6 = v[0]*s6 + v[1]*c6;
            v[0] = x6; v[1] = y6;

            // 막대 그래프 업데이트
            UI.barX.style.height = `${v[0]*v[0]*100}%`;
            UI.barY.style.height = `${v[1]*v[1]*100}%`;
            UI.barZ.style.height = `${v[2]*v[2]*100}%`;
            UI.barW.style.height = `${v[3]*v[3]*100}%`;

            // SVG 시각화 직접 조작
            let projX = (v[0] * pX[0]) + (v[1] * pY[0]) + (v[2] * pZ[0]) + (v[3] * pW[0]);
            let projY = (v[0] * pX[1]) + (v[1] * pY[1]) + (v[2] * pZ[1]) + (v[3] * pW[1]);

            let cx = 300, cy = 300; 
            let p1x = cx - projX; let p1y = cy - projY;
            let p2x = cx + projX; let p2y = cy + projY;

            UI.animLine.setAttribute('x1', p1x);
            UI.animLine.setAttribute('y1', p1y);
            UI.animLine.setAttribute('x2', p2x);
            UI.animLine.setAttribute('y2', p2y);

            UI.animNode1.setAttribute('cx', p1x);
            UI.animNode1.setAttribute('cy', p1y);
            UI.animNode2.setAttribute('cx', p2x);
            UI.animNode2.setAttribute('cy', p2y);
        }

        // 슬라이더 이벤트
        [UI.sliderXY, UI.sliderYZ, UI.sliderXZ, UI.sliderXW, UI.sliderYW, UI.sliderZW].forEach(slider => {
            slider.addEventListener('input', () => {
                if (isPlayingAll) UI.btnPlayAll.click(); 
                updateState(
                    parseFloat(UI.sliderXY.value), parseFloat(UI.sliderYZ.value), parseFloat(UI.sliderXZ.value),
                    parseFloat(UI.sliderXW.value), parseFloat(UI.sliderYW.value), parseFloat(UI.sliderZW.value)
                );
            });
        });

        // 캔버스 드래그 상호작용 (직관적인 화면 회전을 위해 매핑 수정됨)
        let isDragging = false;
        let lastMouse = {x: 0, y: 0};
        
        UI.rightPanel.addEventListener('mousedown', e => { isDragging = true; lastMouse = {x: e.clientX, y: e.clientY}; if(isPlayingAll) UI.btnPlayAll.click(); });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if(!isDragging) return;
            let dx = e.clientX - lastMouse.x;
            let dy = e.clientY - lastMouse.y;
            
            // 수평 드래그 -> YW 평면에 대한 회전 (좌우 비틀기 - X, Z 성분이 움직임)
            // 수직 드래그 -> ZW 평면에 대한 회전 (상하 비틀기 - X, Y 성분이 움직임)
            let n_yw = (parseFloat(UI.sliderYW.value) + dx * 0.4) % 360;
            let n_zw = (parseFloat(UI.sliderZW.value) + dy * 0.4) % 360;
            if(n_yw < 0) n_yw += 360; if(n_zw < 0) n_zw += 360;
            
            updateState(
                parseFloat(UI.sliderXY.value), parseFloat(UI.sliderYZ.value), parseFloat(UI.sliderXZ.value),
                parseFloat(UI.sliderXW.value), n_yw, n_zw
            );
            lastMouse = {x: e.clientX, y: e.clientY};
        });

        // 터치 지원
        UI.rightPanel.addEventListener('touchstart', e => { isDragging = true; lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY}; if(isPlayingAll) UI.btnPlayAll.click(); }, {passive: false});
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', e => {
            if(!isDragging) return;
            e.preventDefault();
            let dx = e.touches[0].clientX - lastMouse.x;
            let dy = e.touches[0].clientY - lastMouse.y;
            
            let n_yw = (parseFloat(UI.sliderYW.value) + dx * 0.4) % 360;
            let n_zw = (parseFloat(UI.sliderZW.value) + dy * 0.4) % 360;
            if(n_yw < 0) n_yw += 360; if(n_zw < 0) n_zw += 360;
            
            updateState(
                parseFloat(UI.sliderXY.value), parseFloat(UI.sliderYZ.value), parseFloat(UI.sliderXZ.value),
                parseFloat(UI.sliderXW.value), n_yw, n_zw
            );
            lastMouse = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        }, {passive: false});

        // 애니메이션 컨트롤
        let isPlayingAll = false;
        UI.btnPlayAll.addEventListener('click', function() {
            isPlayingAll = !isPlayingAll;
            if (isPlayingAll) {
                this.innerText = "회전 정지";
                this.classList.replace('bg-indigo-600', 'bg-rose-600');
            } else {
                this.innerText = "4차원 동시 회전 재생";
                this.classList.replace('bg-rose-600', 'bg-indigo-600');
            }
        });

        UI.btnReset.addEventListener('click', () => {
            if (isPlayingAll) UI.btnPlayAll.click();
            updateState(0, 0, 0, 0, 0, 0);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isPlayingAll) {
                let sXY = (parseFloat(UI.sliderXY.value) + 0.5) % 360;
                let sYZ = (parseFloat(UI.sliderYZ.value) + 0.3) % 360;
                let sXZ = (parseFloat(UI.sliderXZ.value) + 0.4) % 360;
                let sXW = (parseFloat(UI.sliderXW.value) + 0.6) % 360;
                let sYW = (parseFloat(UI.sliderYW.value) + 0.2) % 360;
                let sZW = (parseFloat(UI.sliderZW.value) + 0.5) % 360;
                updateState(sXY, sYZ, sXZ, sXW, sYW, sZW);
            }
        }

        // 초기화 실행
        updateState(0, 0, 0, 0, 0, 0);
        animate();

    </script>
</body>
</html>
